services:
  - name: kingofcards-api
    type: web
    runtime: docker
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: TURSO_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: EMAIL_ENABLED
        value: "true"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: "KingOfCards <no-reply@kingofcards.local>"
      - key: WEB_BASE_URL
        value: https://kingofcards-web.onrender.com
      - key: SENTRY_DSN
        sync: false

  - name: kingofcards-web
    type: web
    runtime: static
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @kingofcards/web... build
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_URL
        value: /trpc
    routes:
      - type: rewrite
        source: /trpc/*
        destination: https://kingofcards-api.onrender.com/trpc/*
      - type: rewrite
        source: /healthz
        destination: https://kingofcards-api.onrender.com/healthz
      - type: rewrite
        source: /*
        destination: /index.html
