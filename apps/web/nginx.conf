server_tokens off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;

    # Re-resolve the api service name per request instead of caching it once at nginx startup:
    # this is what lets `docker compose up --scale api=N` load-balance across replicas via Docker's
    # embedded DNS (127.0.0.11), which rotates the A record it returns across a scaled service.
    resolver 127.0.0.11 valid=10s;

    # Vite fingerprints these filenames by content hash, so a cached copy is always the right one.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    location /trpc/ {
        set $api_upstream api:3001;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        set $api_upstream api:3001;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
    }
}
